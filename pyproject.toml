[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "giri-landslide"
version = "0.2.0"
description = "Physically based landslide hazard model for the Hindu Kush Himalaya (SINMAP over D-infinity flow routing)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "rasterio>=1.3",
    "requests>=2.28",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.6"]
vector = ["fiona>=1.9", "geopandas>=0.13"]

[project.scripts]
giri-landslide = "giri_landslide.cli:main"

[tool.setuptools]
packages = ["giri_landslide", "giri_landslide.input", "giri_landslide.model", "giri_landslide.utility"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
