[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "h-sim"
version = "0.2.0"
description = "H-SIM: Himalayan Slope Instability Model - physically based landslide hazard for the Hindu Kush Himalaya"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "rasterio>=1.3",
    "requests>=2.28",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.6"]
vector = ["fiona>=1.9", "geopandas>=0.13"]

[project.scripts]
h-sim = "h_sim.cli:main"

[tool.setuptools]
packages = ["h_sim", "h_sim.input", "h_sim.model", "h_sim.utility"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
