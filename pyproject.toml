[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "h-sim"
version = "0.2.0"
description = "H-SIM: Himalayan Slope Instability Model - physically based landslide hazard for the Hindu Kush Himalaya"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "rasterio>=1.3",
    "requests>=2.28",
    # Required, not optional: every landslide inventory is a shapefile, and
    # the regional sweep reads its states and provinces through fiona too.
    "fiona>=1.9",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.6", "pillow>=9.0"]
dev = ["pytest>=7.0"]

[project.scripts]
h-sim = "h_sim.cli:main"

[tool.setuptools]
packages = ["h_sim", "h_sim.input", "h_sim.model", "h_sim.utility"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
