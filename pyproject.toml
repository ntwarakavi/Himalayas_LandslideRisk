[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hima-slide"
version = "0.2.0"
description = "HIMA-SLIDE: Himalayan Integrated Model for Assessment of Slope Instability and Debris Erosion"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "rasterio>=1.3",
    "requests>=2.28",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.6"]
vector = ["fiona>=1.9", "geopandas>=0.13"]

[project.scripts]
hima-slide = "hima_slide.cli:main"

[tool.setuptools]
packages = ["hima_slide", "hima_slide.input", "hima_slide.model", "hima_slide.utility"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
